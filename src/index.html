<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Skulptur AR - Eld</title>
  <meta itemprop="name" content="Skulptur AR - Eld">
  <meta name="twitter:title" content="Skulptur AR - Eld">
  <meta property="og:title" content="Skulptur AR - Eld">
  <meta property="og:site_name" content="Skulptur AR - Eld">
  <meta name="description" content="AR-upplevelse med eldeffekt på skulptur.">
  <meta itemprop="description" content="AR-upplevelse med eldeffekt på skulptur.">
  <meta property="og:description" content="AR-upplevelse med eldeffekt på skulptur.">
  <meta name="twitter:description" content="AR-upplevelse med eldeffekt på skulptur.">
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script crossorigin="anonymous" src="./external/xr/xr.js" async="true" data-preload-chunks="face, slam">
  </script>
</head>

<body>
<script src="bundle.js"></script>

<style>
  /* ── Startskärm ─────────────────────────────────────────────────── */
  #start-screen {
    position: fixed;
    inset: 0;
    z-index: 20000;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    transition: opacity 0.6s ease;
  }
  #start-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #start-title {
    color: rgba(255, 255, 255, 0.9);
    font-family: system-ui, sans-serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.08em;
    text-align: center;
    margin: 0;
    padding: 0 40px;
  }
  #start-btn {
    background: transparent;
    border: 1px solid rgba(255, 160, 40, 0.8);
    border-radius: 50px;
    color: rgba(255, 160, 40, 0.9);
    font-family: system-ui, sans-serif;
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 0.1em;
    padding: 16px 48px;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
  }
  #start-btn:active {
    background: rgba(255, 160, 40, 0.2);
  }

  /* ── AR-overlay (visas efter start) ─────────────────────────────── */
  #ar-overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: rgba(0, 0, 0, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  #ar-overlay.visible {
    display: flex;
  }
  #ar-overlay.hidden {
    opacity: 0;
  }
  #ar-overlay-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  #scan-ring {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: rgba(255, 160, 40, 0.9);
    border-right-color: rgba(255, 160, 40, 0.5);
    animation: spin 1.8s linear infinite;
    position: relative;
  }
  #scan-ring::after {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255, 160, 40, 0.2);
  }
  #ar-text {
    color: rgba(255, 255, 255, 0.9);
    font-family: system-ui, sans-serif;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.04em;
    text-align: center;
    margin: 0;
    padding: 0 32px;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50%       { opacity: 1.0; }
  }

  /* ── Musik-knapp ─────────────────────────────────────────────────── */
  #music-btn {
    position: fixed;
    bottom: 28px;
    right: 24px;
    z-index: 9999;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  #music-btn svg {
    width: 24px;
    height: 24px;
    fill: white;
  }

  /* ── Avsluta-knapp (visas under upplevelsen) ─────────────────────── */
  #exit-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
  }

  /* ── Slutskärm (skanna nästa QR) ─────────────────────────────────── */
  #end-screen {
    position: fixed;
    inset: 0;
    z-index: 21000;
    background: rgba(0, 0, 0, 0.94);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 0 40px;
    text-align: center;
  }
  #end-screen.visible {
    display: flex;
  }
  #end-title {
    color: rgba(255, 255, 255, 0.95);
    font-family: system-ui, sans-serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.08em;
    margin: 0;
  }
  #end-text {
    color: rgba(255, 255, 255, 0.7);
    font-family: system-ui, sans-serif;
    font-size: 15px;
    font-weight: 300;
    margin: 0;
    max-width: 300px;
    line-height: 1.6;
  }
  #restart-btn {
    background: transparent;
    border: 1px solid rgba(255, 160, 40, 0.8);
    border-radius: 50px;
    color: rgba(255, 160, 40, 0.9);
    font-family: system-ui, sans-serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.1em;
    padding: 14px 40px;
    cursor: pointer;
  }
  #restart-btn:active {
    background: rgba(255, 160, 40, 0.2);
  }
</style>

<!-- Startskärm -->
<div id="start-screen">
  <p id="start-title">Tryck för att starta upplevelsen</p>
  <button id="start-btn">STARTA</button>
</div>

<!-- AR-overlay (visas efter start) -->
<div id="ar-overlay">
  <div id="ar-overlay-inner">
    <div id="scan-ring"></div>
    <p id="ar-text">Rikta kameran mot skulpturen</p>
  </div>
</div>

<!-- Musik-knapp -->
<button id="music-btn" aria-label="Spela/pausa musik">
  <svg id="icon-playing" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  <svg id="icon-paused" viewBox="0 0 24 24" style="display:none"><path d="M8 5v14l11-7z"/></svg>
</button>

<!-- Avsluta-knapp -->
<button id="exit-btn" aria-label="Avsluta upplevelsen">&#10005;</button>

<!-- Debug-status (world-anchor) -->
<div id="debug-hud" style="position:fixed;top:0;left:0;right:0;z-index:30000;
  background:rgba(0,0,0,0.6);color:#0f0;font:12px monospace;padding:6px 10px;
  text-align:center;pointer-events:none;">anchor: init…</div>

<!-- Slutskärm: uppmana att skanna nästa QR-kod -->
<div id="end-screen">
  <p id="end-title">Skanna nästa skulptur</p>
  <p id="end-text">Rikta telefonens kamera mot en ny QR-kod för nästa upplevelse.</p>
  <button id="restart-btn">&#8635; STARTA OM</button>
</div>

<script>
  // Delad state mellan load- och xrloaded-hanterarna.
  // VIKTIGT: startskärmen får INTE visas medan 8th Wall ber om kamera-/
  // rörelsetillstånd, för då lägger den sig över tillåt-dialogen. Därför hålls
  // den dold tills kameran är redo (reality.ready) — efter beviljat tillstånd.
  let experienceStarted = false   // STARTA tryckt (eller auto-start i editor/desktop)
  let cameraReady       = false   // reality.ready har inträffat

  window.addEventListener('load', () => {
    const startScreen = document.getElementById('start-screen')
    const startBtn    = document.getElementById('start-btn')
    const arOverlay   = document.getElementById('ar-overlay')
    const musicBtn    = document.getElementById('music-btn')
    const iconPlay    = document.getElementById('icon-playing')
    const iconPause   = document.getElementById('icon-paused')
    const exitBtn     = document.getElementById('exit-btn')
    const endScreen   = document.getElementById('end-screen')
    const restartBtn  = document.getElementById('restart-btn')

    // Dölj startskärmen direkt — den avslöjas först när kameran är redo, så
    // den aldrig täcker 8th Walls/webbläsarens tillåt-dialog vid laddning.
    startScreen.style.display = 'none'

    // Visa startskärmen (anropas vid reality.ready på mobil, eller fallback)
    window._revealStartScreen = () => {
      if (experienceStarted) return
      startScreen.style.display = 'flex'
      startScreen.classList.remove('hidden')
    }

    // Starta-knapp — startar musik + scan-overlay. Tillstånd är redan beviljat
    // här (kameran är igång), så scan-overlayn kan visas direkt utan risk.
    const startExperience = (showAROverlay = true) => {
      if (experienceStarted) return
      experienceStarted = true
      // Sätt upp audio-analysern (audioReact) och starta musiken
      if (window._setupAudioAnalyser) window._setupAudioAnalyser()
      const audio = window._arAudio
      if (audio) {
        audio.play().catch(err => console.warn('[audio] play failed:', err))
      }
      startScreen.classList.add('hidden')
      exitBtn.style.display = 'flex'   // visa avsluta-knappen under upplevelsen
      setTimeout(() => {
        startScreen.style.display = 'none'
        if (showAROverlay) arOverlay.classList.add('visible')
      }, 650)
    }
    startBtn.addEventListener('click', () => startExperience(true))

    // Avsluta-knapp — stoppa upplevelsen och visa "skanna nästa QR"-skärm
    exitBtn.addEventListener('click', () => {
      const audio = window._arAudio
      if (audio) audio.pause()
      arOverlay.classList.remove('visible')
      exitBtn.style.display = 'none'
      endScreen.classList.add('visible')
      // Stäng av kameran för att spara batteri (om API:t finns)
      try { if (window.XR8 && XR8.stop) XR8.stop() } catch (e) { /* noop */ }
    })

    // Starta om — ladda om sidan för en ren omstart av denna upplevelse
    restartBtn.addEventListener('click', () => location.reload())

    // Editor/desktop: ingen kameratillstånds-dialog → starta direkt utan startskärm
    const isInEditor    = window.self !== window.top
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0
    if (isInEditor || !isTouchDevice) {
      startExperience(false)
    } else if (cameraReady) {
      // reality.ready hann före load-eventet — visa startskärmen nu
      window._revealStartScreen()
    } else {
      // Säkerhetsnät: visa startskärmen ändå om kamera-callbacket uteblir
      setTimeout(() => window._revealStartScreen && window._revealStartScreen(), 5000)
    }

    // Musik-knapp — pausa/spela
    musicBtn.addEventListener('click', () => {
      const audio = window._arAudio
      if (!audio) return
      if (audio.paused) {
        audio.play()
        iconPlay.style.display  = ''
        iconPause.style.display = 'none'
      } else {
        audio.pause()
        iconPlay.style.display  = 'none'
        iconPause.style.display = ''
      }
    })
  })

  // Visa startskärmen först när kameran faktiskt visar bild (tillstånd beviljat),
  // och göm scan-overlayn när image target hittas.
  // Debug-HUD: visa world-anchor-status live på skärmen
  setInterval(() => {
    const hud = document.getElementById('debug-hud')
    if (!hud) return
    const imgs = window._imageTargetState || {}
    const a    = window._anchorStatus || {}
    const seen = Object.keys(imgs).filter(k => imgs[k]).join(',') || '–'
    hud.textContent = `img:[${seen}] found:${a.found ? 'JA' : 'nej'} hits:${a.hits || 0}/${a.threshold ?? '?'} ` +
      (a.locked ? 'LÅST ✓' : 'ej låst') + (a.err ? ('  ERR: ' + a.err) : '')
    hud.style.color = a.err ? '#f44' : (a.locked ? '#0f0' : (a.found ? '#ff0' : '#f80'))
  }, 150)

  window.addEventListener('xrloaded', () => {
    XR8.addCameraPipelineModule({
      name: 'ar-overlay-module',
      // Pålitligt "kameran är redo"-callback: status 'hasVideo' = livebild igång,
      // vilket bara händer efter att kameratillstånd beviljats.
      onCameraStatusChange: ({status}) => {
        if (status === 'hasVideo') {
          cameraReady = true
          if (window._revealStartScreen) window._revealStartScreen()
        }
      },
      listeners: [
        {
          event: 'reality.imagefound',
          process: ({detail}) => {
            // Spåra vilka bildmål som syns — world-anchor-komponenten läser detta
            window._imageTargetState = window._imageTargetState || {}
            window._imageTargetState[detail.name] = true
            if (detail.name !== 'fram') return
            const overlay = document.getElementById('ar-overlay')
            overlay.classList.add('hidden')
            setTimeout(() => { overlay.classList.remove('visible') }, 900)
          },
        },
        {
          // Håll målet "levande" varje frame det är spårat
          event: 'reality.imageupdated',
          process: ({detail}) => {
            window._imageTargetState = window._imageTargetState || {}
            window._imageTargetState[detail.name] = true
          },
        },
        {
          // Markören lämnade bilden — world-anchor har redan fryst innehållet
          event: 'reality.imagelost',
          process: ({detail}) => {
            window._imageTargetState = window._imageTargetState || {}
            window._imageTargetState[detail.name] = false
          },
        },
      ],
    })
  })
</script>

</body>
</html>
