<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Skulptur AR - Eld</title>
  <meta itemprop="name" content="Skulptur AR - Eld">
  <meta name="twitter:title" content="Skulptur AR - Eld">
  <meta property="og:title" content="Skulptur AR - Eld">
  <meta property="og:site_name" content="Skulptur AR - Eld">
  <meta name="description" content="AR-upplevelse med eldeffekt på skulptur.">
  <meta itemprop="description" content="AR-upplevelse med eldeffekt på skulptur.">
  <meta property="og:description" content="AR-upplevelse med eldeffekt på skulptur.">
  <meta name="twitter:description" content="AR-upplevelse med eldeffekt på skulptur.">

<body>
<script src="bundle.js"></script>

<style>
  /* ── Startskärm ─────────────────────────────────────────────────── */
  #start-screen {
    position: fixed;
    inset: 0;
    z-index: 20000;
    background: rgba(0, 0, 0, 0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    transition: opacity 0.6s ease;
  }
  #start-screen.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #start-title {
    color: rgba(255, 255, 255, 0.9);
    font-family: system-ui, sans-serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.08em;
    text-align: center;
    margin: 0;
    padding: 0 40px;
  }
  #start-btn {
    background: transparent;
    border: 1px solid rgba(255, 160, 40, 0.8);
    border-radius: 50px;
    color: rgba(255, 160, 40, 0.9);
    font-family: system-ui, sans-serif;
    font-size: 16px;
    font-weight: 300;
    letter-spacing: 0.1em;
    padding: 16px 48px;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
  }
  #start-btn:active {
    background: rgba(255, 160, 40, 0.2);
  }

  /* ── AR-overlay (visas efter start) ─────────────────────────────── */
  #ar-overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    /* Lätt slöja så live-kameran syns igenom → besökaren ser den fysiska
       markören bakom den halvtransparenta markörbilden och kan rikta in sig. */
    background: rgba(0, 0, 0, 0.3);
    display: none;
    align-items: center;
    justify-content: center;
    transition: opacity 0.8s ease;
    pointer-events: none;
  }
  #ar-overlay.visible {
    display: flex;
  }
  #ar-overlay.hidden {
    opacity: 0;
  }
  #ar-overlay-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding: 0 28px;
  }
  #scan-img {
    width: 200px;
    max-width: 60vw;
    border-radius: 14px;
    border: 2px solid rgba(255, 160, 40, 0.7);
    box-shadow: 0 0 30px rgba(255, 120, 20, 0.35);
    /* Halvtransparent → den fysiska markören bakom skiner igenom för inriktning. */
    opacity: 0.5;
  }
  #ar-text #scan-name { color: rgba(255, 180, 80, 1); font-weight: 500; }
  #scan-ring {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.15);
    border-top-color: rgba(255, 160, 40, 0.9);
    border-right-color: rgba(255, 160, 40, 0.5);
    animation: spin 1.8s linear infinite;
    position: relative;
  }
  #scan-ring::after {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255, 160, 40, 0.2);
  }
  #ar-text {
    color: rgba(255, 255, 255, 0.9);
    font-family: system-ui, sans-serif;
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.04em;
    text-align: center;
    margin: 0;
    padding: 0 32px;
    animation: pulse 2.4s ease-in-out infinite;
    /* Läsbar mot live-kameran bakom den nu ljusare slöjan */
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.7; }
    50%       { opacity: 1.0; }
  }

  /* ── Musik-knapp ─────────────────────────────────────────────────── */
  #music-btn {
    position: fixed;
    bottom: 28px;
    right: 24px;
    z-index: 9999;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
  }
  #music-btn svg {
    width: 24px;
    height: 24px;
    fill: white;
  }

  /* ── Avsluta-knapp (visas under upplevelsen) ─────────────────────── */
  #exit-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 9999;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
  }

  /* ── Slutskärm (skanna nästa QR) ─────────────────────────────────── */
  #end-screen {
    position: fixed;
    inset: 0;
    z-index: 21000;
    background: rgba(0, 0, 0, 0.94);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 0 40px;
    text-align: center;
  }
  #end-screen.visible {
    display: flex;
  }
  #end-title {
    color: rgba(255, 255, 255, 0.95);
    font-family: system-ui, sans-serif;
    font-size: 22px;
    font-weight: 300;
    letter-spacing: 0.08em;
    margin: 0;
  }
  #end-text {
    color: rgba(255, 255, 255, 0.7);
    font-family: system-ui, sans-serif;
    font-size: 15px;
    font-weight: 300;
    margin: 0;
    max-width: 300px;
    line-height: 1.6;
  }
  #restart-btn {
    background: transparent;
    border: 1px solid rgba(255, 160, 40, 0.8);
    border-radius: 50px;
    color: rgba(255, 160, 40, 0.9);
    font-family: system-ui, sans-serif;
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 0.1em;
    padding: 14px 40px;
    cursor: pointer;
  }
  #restart-btn:active {
    background: rgba(255, 160, 40, 0.2);
  }

  /* ── Kalibreringspanel (visas bara med ?calibrate=1) ─────────────── */
  #calib {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30000;
    background: rgba(0,0,0,0.80); color: #fff;
    font: 13px system-ui, sans-serif; padding: 10px 12px 18px;
    display: none; backdrop-filter: blur(6px);
  }
  #calib.visible { display: block; }
  #calib .row { display: flex; align-items: center; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
  #calib .lbl { width: 52px; opacity: 0.75; font-size: 12px; }
  #calib button {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    color: #fff; border-radius: 8px; padding: 10px 12px; font-size: 14px; min-width: 42px;
  }
  #calib button:active { background: rgba(255,160,40,0.4); }
  #calib #step-btn.hot { background: rgba(255,160,40,0.35); border-color: rgba(255,160,40,0.8); }
  #calib .read {
    margin-top: 10px; font: 12px monospace; color: #ffb060; word-break: break-all;
    user-select: all; -webkit-user-select: all;
  }
  #calib #calib-hint { font-size: 12px; opacity: 0.7; margin-bottom: 8px; text-align: center; }
  #calib .tool {
    flex: 1; padding: 12px 8px; font-size: 13px; display: flex; flex-direction: column;
    align-items: center; gap: 5px;
  }
  #calib .tool svg { width: 26px; height: 26px; }
  #calib .tool.active { background: rgba(255,160,40,0.4); border-color: rgba(255,160,40,0.9); }
  #calib #save-btn {
    flex: 1; background: rgba(255,160,40,0.25); border-color: rgba(255,160,40,0.8); padding: 14px;
  }
  #calib #save-status { font-size: 12px; opacity: 0.85; margin-left: 10px; }

  /* Heltäckande lager som fångar drag-gester (under panelen, över AR-vyn) */
  #gesture-layer {
    position: fixed; inset: 0; z-index: 25000; display: none; touch-action: none;
  }
  #gesture-layer.on { display: block; }
</style>

<!-- Startskärm -->
<div id="start-screen">
  <p id="start-title">Tryck för att starta upplevelsen</p>
  <button id="start-btn">STARTA</button>
</div>

<!-- AR-overlay (visas efter start) -->
<div id="ar-overlay">
  <div id="ar-overlay-inner">
    <img id="scan-img" src="image-targets/fram_original.png" alt="" onerror="this.style.display='none'">
    <p id="ar-text">Scanna <b id="scan-name">Eld</b></p>
    <div id="scan-ring"></div>
  </div>
</div>

<!-- Musik-knapp -->
<button id="music-btn" aria-label="Spela/pausa musik">
  <svg id="icon-playing" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  <svg id="icon-paused" viewBox="0 0 24 24" style="display:none"><path d="M8 5v14l11-7z"/></svg>
</button>

<!-- Avsluta-knapp -->
<button id="exit-btn" aria-label="Avsluta upplevelsen">&#10005;</button>

<!-- Debug-status (world-anchor) — visas bara med ?debug=1 eller ?calibrate=1 -->
<div id="debug-hud" style="position:fixed;top:0;left:0;right:0;z-index:30000;
  background:rgba(0,0,0,0.6);color:#0f0;font:12px monospace;padding:6px 10px;
  text-align:center;pointer-events:none;display:none;">anchor: init…</div>

<!-- Gestlager: dra på skärmen för att manipulera elden (admin/kalibrering) -->
<div id="gesture-layer"></div>

<!-- Kalibreringspanel (visas bara med ?calibrate=1 / ?admin=KOD) -->
<div id="calib">
  <div id="calib-hint">Rikta mot markören tills <b>LÅST ✓</b>, dra sedan på skärmen.</div>
  <div class="row" id="tool-row">
    <button class="tool active" data-tool="move">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20M12 2 9 5M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/></svg>
      <span>Flytta</span>
    </button>
    <button class="tool" data-tool="rotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/></svg>

      <span>Skala</span>
    </button>
  </div>
  <div class="read" id="calib-read">pos … rot … scale …</div>

  </div>
</div>

<!-- Slutskärm: uppmana att skanna nästa QR-kod -->
<div id="end-screen">
  <p id="end-title">Skanna nästa skulptur</p>
  <p id="end-text">Rikta telefonens kamera mot en ny QR-kod för nästa upplevelse.</p>
  <button id="restart-btn">&#8635; STARTA OM</button>
</div>

<script>
  // ── Identitet + sparad kalibrering ────────────────────────────────────
  // Byt SCULPTURE_ID per skulptur/deploy (eld, luft, ...). Kan även sättas
  // via ?id=… i URL:en. Avgör vilken placering som hämtas/sparas på servern.
  const SCULPTURE_ID = (new URLSearchParams(location.search).get('id')) || 'eld'
  // Namnet som visas på scan-skärmen ("Scanna Eld"). Byt per skulptur.
  const SCULPTURE_NAME = (new URLSearchParams(location.search).get('name')) || 'Eld'
  // Meny-appens URL: dit man går vid ✕ och när upplevelsen är slut. Tom = av
  // (då visas "skanna nästa QR"-skärmen istället). Fyll i när menyn är deployad.
  const MENU_URL = 'https://ar-skulptur-meny.vercel.app/'
  window.addEventListener('DOMContentLoaded', () => {
    const n = document.getElementById('scan-name')
    if (n) n.textContent = SCULPTURE_NAME
  })

  // Hämta sparad placering så fort som möjligt → world-anchor applicerar den.
  fetch(`/api/calibration?id=${encodeURIComponent(SCULPTURE_ID)}`)
    .then(r => r.json())
    .then(d => { if (d && d.calibration) window._savedCalibration = d.calibration })
    .catch(() => { /* ingen sparad placering / API ej uppe än */ })


  // Delad state mellan load- och xrloaded-hanterarna.
  // VIKTIGT: startskärmen får INTE visas medan 8th Wall ber om kamera-/
  // rörelsetillstånd, för då lägger den sig över tillåt-dialogen. Därför hålls
  // den dold tills kameran är redo (reality.ready) — efter beviljat tillstånd.
  let experienceStarted = false   // STARTA tryckt (eller auto-start i editor/desktop)
  let cameraReady       = false   // reality.ready har inträffat

  window.addEventListener('load', () => {
    const startScreen = document.getElementById('start-screen')
    const startBtn    = document.getElementById('start-btn')
    const arOverlay   = document.getElementById('ar-overlay')
    const musicBtn    = document.getElementById('music-btn')
    const iconPlay    = document.getElementById('icon-playing')
    const iconPause   = document.getElementById('icon-paused')
    const exitBtn     = document.getElementById('exit-btn')
    const endScreen   = document.getElementById('end-screen')
    const restartBtn  = document.getElementById('restart-btn')

    // Dölj startskärmen direkt — den avslöjas först när kameran är redo, så
    // den aldrig täcker 8th Walls/webbläsarens tillåt-dialog vid laddning.
    startScreen.style.display = 'none'

    // Visa startskärmen (anropas vid reality.ready på mobil, eller fallback)
    window._revealStartScreen = () => {
      if (experienceStarted) return
      startScreen.style.display = 'flex'
      startScreen.classList.remove('hidden')
    }

    // Starta musiken (en gång) — anropas när markören scannas
    window._startMusic = () => {
      const audio = window._arAudio
      if (!audio || window._musicStarted) return
      window._musicStarted = true
      try { audio.currentTime = 0 } catch (e) { /* */ }
      audio.play().catch(err => console.warn('[audio] play failed:', err))
    }

    // Starta-knapp — startar musik + scan-overlay. Tillstånd är redan beviljat
    // här (kameran är igång), så scan-overlayn kan visas direkt utan risk.
    const startExperience = (showAROverlay = true) => {
      if (experienceStarted) return
      experienceStarted = true
      // Sätt upp audio-analysern (audioReact). Musiken startar dock först när
      // markören scannas (imagefound) — men vi "låser upp" ljudet här i
      // user-gesten, annars blockerar webbläsaren autoplay senare.
      if (window._setupAudioAnalyser) window._setupAudioAnalyser()
      const audio = window._arAudio
      // Spela musiken direkt (så man hör/ser eldens reaktivitet) i preview:
      //  - editor/dator-auto-start (showAROverlay === false), eller
      //  - ?music=1 i URL:en.
      // På riktig mobil (touch, STARTA-knappen → showAROverlay = true) startar
      // musiken fortfarande vid scan (imagefound), som tänkt för besökare.
      const testMusic = /[?&]music=1/.test(location.search) || showAROverlay === false
      if (testMusic && window._startMusic) {
        window._startMusic()
      } else if (audio) {
        audio.play().then(() => audio.pause()).catch(() => {})
      }
      startScreen.classList.add('hidden')
      exitBtn.style.display = 'flex'   // visa avsluta-knappen under upplevelsen

      // Avslöja scan-overlay + kalibrerings-UI. Görs först när kameran ÄR igång
      // (tillstånd beviljat) — annars kan eld-bilden/gestlagret täcka tillåt-dialogen.
      const revealAfterStart = () => {
        startScreen.style.display = 'none'
        if (showAROverlay) arOverlay.classList.add('visible')
        if (window._calibrateMode) {
          document.getElementById('calib').classList.add('visible')
          document.getElementById('gesture-layer').classList.add('on')
        }
      }
      setTimeout(() => {
        if (cameraReady) revealAfterStart()
        else window._deferredReveal = revealAfterStart   // visas när kameran är redo
      }, 650)
    }
    startBtn.addEventListener('click', () => startExperience(true))

    // Gå tillbaka till meny-appen (om MENU_URL satt), annars visa slutskärm
    const goToMenuOrEnd = () => {
      const audio = window._arAudio
      if (audio) audio.pause()
      if (MENU_URL) {
        // I admin-läge: tillbaka till admin-menyn (behåll ?admin=KODEN) så man
        // kan välja nästa skulptur att placera. Annars vanliga menyn.
        const code = new URLSearchParams(location.search).get('admin')
        location.href = code
          ? MENU_URL + (MENU_URL.includes('?') ? '&' : '?') + 'admin=' + encodeURIComponent(code)
          : MENU_URL
        return
      }
      arOverlay.classList.remove('visible')
      exitBtn.style.display = 'none'
      endScreen.classList.add('visible')
      // Stäng av kameran för att spara batteri (om API:t finns)
      try { if (window.XR8 && XR8.stop) XR8.stop() } catch (e) { /* noop */ }
    }

    // Avsluta-knapp (✕) → tillbaka till menyn / slutskärm
    exitBtn.addEventListener('click', goToMenuOrEnd)

    // När musiken (upplevelsen) tar slut → automatiskt tillbaka till menyn
    const arAudio = window._arAudio
    if (arAudio && MENU_URL) {
      arAudio.loop = false
      arAudio.addEventListener('ended', goToMenuOrEnd)
    }

    // Starta om — ladda om sidan för en ren omstart av denna upplevelse
    restartBtn.addEventListener('click', () => location.reload())

    // Editor/desktop: ingen kameratillstånds-dialog → starta direkt utan startskärm
    const isInEditor    = window.self !== window.top
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0
    if (isInEditor || !isTouchDevice) {
      startExperience(false)
    } else if (cameraReady) {
      // reality.ready hann före load-eventet — visa startskärmen nu
      window._revealStartScreen()
    } else {
      // Säkerhetsnät: visa startskärmen ändå om kamera-callbacket uteblir
      setTimeout(() => window._revealStartScreen && window._revealStartScreen(), 5000)
    }

    // Musik-knapp — pausa/spela
    musicBtn.addEventListener('click', () => {
      const audio = window._arAudio
      if (!audio) return
      if (audio.paused) {
        audio.play()
        iconPlay.style.display  = ''
        iconPause.style.display = 'none'
      } else {
        audio.pause()
        iconPlay.style.display  = 'none'
        iconPause.style.display = ''
      }
    })
  })

  // Visa startskärmen först när kameran faktiskt visar bild (tillstånd beviljat),
  // och göm scan-overlayn när image target hittas.
  // ── Kalibreringsläge + debug-HUD (aktiveras via URL) ──────────────────
  const params      = location.search + location.hash
  const adminCode   = new URLSearchParams(location.search).get('admin')
  const adminOn     = !!adminCode
  const calibrateOn = adminOn || /calibrate/.test(params)
  const debugOn     = calibrateOn || /debug/.test(params)

  if (debugOn) document.getElementById('debug-hud').style.display = 'block'

  if (calibrateOn) {
    window._calibrateMode = true
    // OBS: panelen + gestlagret visas först när upplevelsen startat (i
    // startExperience), så de inte täcker START-knappen/tillåt-dialogen.

    const api = () => window._anchorApi

    // ── Verktygsval (Flytta / Rotera / Skala) ─────────────────────────────
    let tool = 'move'
    document.querySelectorAll('#tool-row .tool').forEach(b => b.addEventListener('click', () => {
      tool = b.dataset.tool
      document.querySelectorAll('#tool-row .tool').forEach(x => x.classList.toggle('active', x === b))
      if (api() && api().showGizmo) api().showGizmo(tool === 'rotate')  // visa ringar i rotationsläge
    }))

    // ── Drag-gester på gestlagret ─────────────────────────────────────────
    const MOVE_K = 0.0025   // meter per pixel
    const ROT_K  = 0.3      // grader per pixel
    const SCL_K  = 0.004    // skala per pixel (en-finger skala)
    const layer  = document.getElementById('gesture-layer')
    let last = null, pinch = 0, twoY = null

    const dist = (a, b) => Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)

    layer.addEventListener('touchstart', e => {
      const a = api()
      if (e.touches.length === 1) {
        const x = e.touches[0].clientX, y = e.touches[0].clientY
        last = {x, y}
        if (tool === 'rotate' && a && a.gizmoDown) a.gizmoDown(x, y)  // ta tag i en ring
      } else if (e.touches.length === 2) {
        pinch = dist(e.touches[0], e.touches[1])
        twoY  = (e.touches[0].clientY + e.touches[1].clientY) / 2
        last = null
      }
      e.preventDefault()
    }, {passive: false})

    layer.addEventListener('touchmove', e => {
      const a = api(); if (!a) return
      if (e.touches.length === 2) {
        // Två fingrar: nyp = skala, vertikal dra = djup (i Flytta-läge)
        const d = dist(e.touches[0], e.touches[1])
        if (pinch) a.scaleBy(d / pinch)
        pinch = d
        const ay = (e.touches[0].clientY + e.touches[1].clientY) / 2
        if (tool === 'move' && twoY != null) a.moveDepth(-(ay - twoY) * MOVE_K)
        twoY = ay
        e.preventDefault(); return
      }
      if (e.touches.length === 1 && last) {
        const x = e.touches[0].clientX, y = e.touches[0].clientY
        const dx = x - last.x, dy = y - last.y
        last = {x, y}
        if (tool === 'move')        a.moveScreen(dx * MOVE_K, -dy * MOVE_K)
        else if (tool === 'rotate') a.gizmoMove(x, y)        // rotera kring greppad ring
        else if (tool === 'scale')  a.scaleBy(1 + (-dy) * SCL_K)
        e.preventDefault()
      }
    }, {passive: false})

    layer.addEventListener('touchend', e => {
      const a = api(); if (a && a.gizmoUp) a.gizmoUp()
      if (e.touches.length === 0) { last = null; pinch = 0; twoY = null }
    })

    // ── Admin: SPARA-knapp ────────────────────────────────────────────────
    if (adminOn) {
      document.getElementById('calib-save-row').style.display = 'flex'
      const saveBtn = document.getElementById('save-btn')
      const saveStatus = document.getElementById('save-status')
      saveBtn.addEventListener('click', () => {
        if (!api()) { saveStatus.textContent = 'inte redo (lås först)'; return }
        const t = api().read()
        saveStatus.textContent = 'sparar…'
        fetch('/api/calibration', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({id: SCULPTURE_ID, passcode: adminCode, pos: t.pos, rot: t.rot, scale: t.scale}),
        })
          .then(r => r.json().then(j => ({ok: r.ok, j})))
          .then(({ok, j}) => {
            saveStatus.textContent = ok ? 'Sparat ✓ — tillbaka till menyn…' : ('Fel: ' + (j.error || ''))
            // Lyckad sparning → tillbaka till admin-menyn för nästa skulptur.
            if (ok && MENU_URL) setTimeout(() => {
              location.href = MENU_URL + (MENU_URL.includes('?') ? '&' : '?') + 'admin=' + encodeURIComponent(adminCode)
            }, 1500)
          })
          .catch(() => { saveStatus.textContent = 'Nätverksfel' })
      })
    }

    // Live-avläsning av aktuell placering
    setInterval(() => {
      if (!api()) return
      const t = api().read()
      document.getElementById('calib-read').textContent =
        `Pos ${t.pos.join(', ')}   Rot ${t.rot.join(', ')}   Scale ${t.scale}`
    }, 200)
  }

  // Debug-HUD: visa world-anchor-status live på skärmen
  setInterval(() => {
    const hud = document.getElementById('debug-hud')
    if (!hud || !debugOn) return
    const imgs = window._imageTargetState || {}
    const a    = window._anchorStatus || {}
    const seen = Object.keys(imgs).filter(k => imgs[k]).join(',') || '–'
    hud.textContent = `img:[${seen}] found:${a.found ? 'JA' : 'nej'} hits:${a.hits || 0}/${a.threshold ?? '?'} ` +
      (a.locked ? 'LÅST ✓' : 'ej låst') + (a.err ? ('  ERR: ' + a.err) : '')
    hud.style.color = a.err ? '#f44' : (a.locked ? '#0f0' : (a.found ? '#ff0' : '#f80'))
  }, 150)

  window.addEventListener('xrloaded', () => {
    XR8.addCameraPipelineModule({
      name: 'ar-overlay-module',
      // Pålitligt "kameran är redo"-callback: status 'hasVideo' = livebild igång,
      // vilket bara händer efter att kameratillstånd beviljats.
      onCameraStatusChange: ({status}) => {
        if (status === 'hasVideo') {
          cameraReady = true
          if (window._revealStartScreen) window._revealStartScreen()
          // Om STARTA trycktes innan kameran var redo (fallback) — avslöja nu
          if (window._deferredReveal) { window._deferredReveal(); window._deferredReveal = null }
        }
      },
      listeners: [
        {
          event: 'reality.imagefound',
          process: ({detail}) => {
            // Spåra vilka bildmål som syns — world-anchor-komponenten läser detta
            window._imageTargetState = window._imageTargetState || {}
            window._imageTargetState[detail.name] = true
            if (detail.name !== 'fram') return
            if (window._startMusic) window._startMusic()   // musiken startar vid scan
            const overlay = document.getElementById('ar-overlay')
            overlay.classList.add('hidden')
            setTimeout(() => { overlay.classList.remove('visible') }, 900)
          },
        },
        {
          // Håll målet "levande" varje frame det är spårat
          event: 'reality.imageupdated',
          process: ({detail}) => {
            window._imageTargetState = window._imageTargetState || {}
            window._imageTargetState[detail.name] = true
          },
        },
        {
          // Markören lämnade bilden — world-anchor har redan fryst innehållet
          event: 'reality.imagelost',
          process: ({detail}) => {
            window._imageTargetState = window._imageTargetState || {}
            window._imageTargetState[detail.name] = false
          },
        },
      ],
    })
  })
</script>

</body>
</html>
